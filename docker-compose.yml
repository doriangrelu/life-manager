# Environnement de développement : PostgreSQL + Keycloak.
# Les mots de passe ci-dessous sont des valeurs de dev, à surcharger via .env.
name: life-manager

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres}
      # Mots de passe des comptes applicatifs, lus par le script d'init.
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity}
      HOUSEHOLD_DB_PASSWORD: ${HOUSEHOLD_DB_PASSWORD:-household}
      BUDGET_DB_PASSWORD: ${BUDGET_DB_PASSWORD:-budget}
      VEHICLE_DB_PASSWORD: ${VEHICLE_DB_PASSWORD:-vehicle}
      SHOPPING_DB_PASSWORD: ${SHOPPING_DB_PASSWORD:-shopping}
      REMINDER_DB_PASSWORD: ${REMINDER_DB_PASSWORD:-reminder}
      BILLS_DB_PASSWORD: ${BILLS_DB_PASSWORD:-bills}
      PROJECT_DB_PASSWORD: ${PROJECT_DB_PASSWORD:-project}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HTTP_PORT: 8180
      KC_HEALTH_ENABLED: "true"
      # Adresse de la PWA de dev : le logo de la console « Mon compte » y ramène.
      LM_PWA_URL: http://localhost:5173
    ports:
      - "8180:8180"
    volumes:
      # Seul le realm de développement est importé (le dossier contient aussi celui de production).
      - ./infra/keycloak/realm-life-manager.json:/opt/keycloak/data/import/realm-life-manager.json:ro
      # Thème de la page de connexion (rechargé à chaud en mode start-dev).
      - ./infra/keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
