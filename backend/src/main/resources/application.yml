micronaut:
  application:
    name: life-manager
  server:
    port: ${SERVER_PORT:8080}
    # Pièces jointes du carnet : 10 Mo par fichier, un fichier par requête (plus l'enveloppe multipart).
    max-request-size: 11MB
    multipart:
      max-file-size: 10MB
  serde:
    serialization:
      # Contrat d'API explicite : listes vides ([]) et absences (null) sont toujours écrites dans le JSON.
      inclusion: always
  http:
    services:
      keycloak:
        url: ${KEYCLOAK_URL:`http://localhost:8180`}
        read-timeout: 5s
        connect-timeout: 2s

# Les jetons sont opaques : chacun est vérifié par l'introspection Keycloak (jamais décodé).
security:
  introspection:
    path: /realms/life-manager/protocol/openid-connect/token/introspect
    client-id: ${KEYCLOAK_API_CLIENT_ID:life-manager-api}
    client-secret: ${KEYCLOAK_API_CLIENT_SECRET:dev-api-secret-change-me}
    audience: life-manager-api
    cache-ttl: 30s

# Une datasource par domaine métier : même base, schéma et compte différents.
# Découper un domaine en service = changer son URL.
datasources:
  identity:
    url: ${IDENTITY_DB_URL:`jdbc:postgresql://localhost:5432/lifemanager`}
    username: ${IDENTITY_DB_USER:identity_app}
    password: ${IDENTITY_DB_PASSWORD:identity}
    schema: identity
    driver-class-name: org.postgresql.Driver
    dialect: POSTGRES
    maximum-pool-size: 5
  household:
    url: ${HOUSEHOLD_DB_URL:`jdbc:postgresql://localhost:5432/lifemanager`}
    username: ${HOUSEHOLD_DB_USER:household_app}
    password: ${HOUSEHOLD_DB_PASSWORD:household}
    schema: household
    driver-class-name: org.postgresql.Driver
    dialect: POSTGRES
    maximum-pool-size: 5
  budget:
    url: ${BUDGET_DB_URL:`jdbc:postgresql://localhost:5432/lifemanager`}
    username: ${BUDGET_DB_USER:budget_app}
    password: ${BUDGET_DB_PASSWORD:budget}
    schema: budget
    driver-class-name: org.postgresql.Driver
    dialect: POSTGRES
    maximum-pool-size: 5

  vehicle:
    url: ${VEHICLE_DB_URL:`jdbc:postgresql://localhost:5432/lifemanager`}
    username: ${VEHICLE_DB_USER:vehicle_app}
    password: ${VEHICLE_DB_PASSWORD:vehicle}
    schema: vehicle
    driver-class-name: org.postgresql.Driver
    dialect: POSTGRES
    maximum-pool-size: 5

  shopping:
    url: ${SHOPPING_DB_URL:`jdbc:postgresql://localhost:5432/lifemanager`}
    username: ${SHOPPING_DB_USER:shopping_app}
    password: ${SHOPPING_DB_PASSWORD:shopping}
    schema: shopping
    driver-class-name: org.postgresql.Driver
    dialect: POSTGRES
    maximum-pool-size: 5

  reminder:
    url: ${REMINDER_DB_URL:`jdbc:postgresql://localhost:5432/lifemanager`}
    username: ${REMINDER_DB_USER:reminder_app}
    password: ${REMINDER_DB_PASSWORD:reminder}
    schema: reminder
    driver-class-name: org.postgresql.Driver
    dialect: POSTGRES
    maximum-pool-size: 5

# Une configuration Flyway (et donc un historique de migrations) par domaine.
flyway:
  datasources:
    identity:
      enabled: true
      locations: classpath:db/migration/identity
      default-schema: identity
    household:
      enabled: true
      locations: classpath:db/migration/household
      default-schema: household
    budget:
      enabled: true
      locations: classpath:db/migration/budget
      default-schema: budget
    vehicle:
      enabled: true
      locations: classpath:db/migration/vehicle
      default-schema: vehicle
    shopping:
      enabled: true
      locations: classpath:db/migration/shopping
      default-schema: shopping
    reminder:
      enabled: true
      locations: classpath:db/migration/reminder
      default-schema: reminder

# Fuseau des utilisateurs : sert à savoir quel jour on est (ex. refuser une dépense datée de demain).
life-manager:
  time-zone: Europe/Paris
  # Dossier des fichiers envoyés (un sous-dossier par domaine). En production : un volume sauvegardé.
  storage:
    root: ${STORAGE_ROOT:./data/files}

endpoints:
  health:
    enabled: true
    sensitive: false
