name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (tests, Checkstyle, ArchUnit) — ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 : version de développement ; 16 : version du PostgreSQL partagé du VPS.
        postgres: [postgres:18-alpine, postgres:16-alpine]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          cache: maven
      # Testcontainers utilise le Docker fourni par le runner.
      - run: ./mvnw -B verify -Dtest.postgres.image=${{ matrix.postgres }}

  frontend:
    name: PWA (types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run build

  native:
    name: Build natif GraalVM
    # Long et gourmand (~7 Go de RAM) : seulement sur main ou à la demande.
    if: github.ref == 'refs/heads/main'
    needs: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          cache: maven
      - run: ./mvnw -B package -Dpackaging=native-image -Dmicronaut.aot.enabled=true -DskipTests
