name: Publication des images

# Un tag de version (ex. v0.1.0) construit et publie les images de production sur GitHub Container Registry.
# Le déploiement reste lancé à la main sur le serveur (infra/deploy/deploy.sh <tag>).
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  # Adresse publique de Keycloak, figée dans la PWA au build.
  OIDC_AUTHORITY: https://iabilis.fr/realms/life-manager

jobs:
  images:
    name: Image ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: life-manager-api
            context: backend
          - image: life-manager-web
            context: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: VITE_OIDC_AUTHORITY=${{ env.OIDC_AUTHORITY }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.ref_name }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
