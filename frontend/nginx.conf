# Fichiers de la PWA. HTTPS, compression et en-têtes de sécurité sont gérés par le Caddy du serveur.
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # Fichiers à noms hachés : gardés en cache un an.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Point d'entrée et service worker : toujours revérifiés, pour recevoir les mises à jour.
    location ~ ^/(index\.html|sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
