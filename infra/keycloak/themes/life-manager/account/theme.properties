# Console « Mon compte » (keycloak.v3) aux couleurs de Life Manager.
# Comme pour la page de connexion : seuls des styles, le logo et des textes sont surchargés,
# l'application React de Keycloak reste celle d'origine (mises à jour sans risque).
parent=keycloak.v3
import=common/keycloak

darkMode=true
kcDarkModeClass=pf-v5-theme-dark

title=Mon compte · Life Manager
description=Gérer votre compte Life Manager : informations personnelles, mot de passe, appareils connectés.
favIcon=/img/logo.svg
logo=/img/logo.svg
# Le logo ramène à la PWA (par défaut il mène à la racine de Keycloak, c'est-à-dire au realm master).
# Adresse de production par défaut ; le compose de dev la remplace par la variable LM_PWA_URL.
logoUrl=${env.LM_PWA_URL:https://maison.dorian-grelu.fr}

# Chargé après les styles de l'application parente, pour les surcharger.
styles=css/life-manager.css
