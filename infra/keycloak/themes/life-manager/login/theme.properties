# Page de connexion de Life Manager : celle de Keycloak (keycloak.v2), aux couleurs de l'application.
# Seuls des styles, le logo et des textes sont surchargés : les mises à jour de Keycloak restent sans risque.
parent=keycloak.v2
import=common/keycloak

# css/styles.css vient du thème parent ; life-manager.css est chargé après pour le surcharger.
styles=css/styles.css css/life-manager.css
