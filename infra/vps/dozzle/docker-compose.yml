# Interface web Docker du VPS : Dozzle (état, journaux, relance des conteneurs),
# protégée par oauth2-proxy + Keycloak (realm « infra »). Installé dans ~/dozzle.
#
# ⚠ Dozzle a accès au socket Docker = pleins pouvoirs sur le serveur.
# Il n'est joignable QUE par oauth2-proxy, sur un réseau privé sans accès extérieur :
# ni port publié, ni route Caddy directe, ni présence sur le réseau « socle ».
# Dozzle fait confiance à l'identité transmise par oauth2-proxy (en-têtes X-Forwarded-*).
#
# Secrets dans ~/dozzle/.env (droits 600) : OAUTH2_PROXY_COOKIE_SECRET, OAUTH2_PROXY_CLIENT_SECRET
# (ce dernier saisi par Dorian avec ./configurer-acces.sh, qui remplit aussi emails-autorises.txt).

services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6
    container_name: dozzle-oauth2-proxy
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://iabilis.fr/realms/infra
      OAUTH2_PROXY_CLIENT_ID: oauth2-proxy
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_REDIRECT_URL: https://docker.dorian-grelu.fr/oauth2/callback
      OAUTH2_PROXY_UPSTREAMS: http://dozzle:8080
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      # Caddy termine le HTTPS : URL construites en https grâce aux en-têtes transmis
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_EXPIRE: 8h
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      # Va directement à la page Keycloak (pas de page intermédiaire)
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      # Seules les adresses listées dans ce fichier entrent
      OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE: /etc/oauth2-proxy/emails-autorises.txt
      # Identité transmise à Dozzle : l'adresse e-mail plutôt que l'identifiant Keycloak
      OAUTH2_PROXY_PREFER_EMAIL_TO_USER: "true"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
    volumes:
      - ./emails-autorises.txt:/etc/oauth2-proxy/emails-autorises.txt:ro
    deploy:
      resources:
        limits: { cpus: "0.15", memory: 64M }
    expose: ["4180"]
    networks: [socle, prive]

  dozzle:
    image: amir20/dozzle:v11.4.3
    container_name: dozzle
    restart: unless-stopped
    environment:
      DOZZLE_AUTH_PROVIDER: forward-proxy
      DOZZLE_AUTH_HEADER_USER: X-Forwarded-User
      DOZZLE_AUTH_HEADER_EMAIL: X-Forwarded-Email
      # Boutons démarrer / arrêter / relancer ; pas de terminal dans les conteneurs
      DOZZLE_ENABLE_ACTIONS: "true"
      DOZZLE_NO_ANALYTICS: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits: { cpus: "0.2", memory: 96M }
    expose: ["8080"]
    networks: [prive]

networks:
  # Réseau partagé avec Caddy (créé par ~/infra) : seul oauth2-proxy y est
  socle:
    external: true
  # Réseau privé oauth2-proxy ↔ Dozzle, sans sortie vers Internet
  prive:
    internal: true
